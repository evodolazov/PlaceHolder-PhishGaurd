[project]
name = "phishguard"
version = "0.1.0"
description = "Milestone 0 foundation for PhishGuard URL analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1.0",
  "Flask-SQLAlchemy>=3.1.1",
  "python-dotenv>=1.0.1",
  "tldextract>=5.0.0",
  "psycopg[binary]>=3.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
